<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GE Scanner — OSRS Dashboard</title>
    <link rel="preconnect" href="https://prices.runescape.wiki">
    <link rel="preconnect" href="https://oldschool.runescape.wiki">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="js/api.js" as="script">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" as="style">
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Start API fetches immediately — don't wait for api.js to load
        window.__gePreload = {
            mapping: fetch('https://prices.runescape.wiki/api/v1/osrs/mapping').then(r => r.json()),
            latest: fetch('https://prices.runescape.wiki/api/v1/osrs/latest').then(r => r.json())
        };
    </script>
    <style>
        /* Section headers */
        .dash-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .dash-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-secondary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dash-section-title .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }
        .dot-red { background: var(--red); box-shadow: 0 0 6px var(--red); }
        .dot-white { background: #ffffff; box-shadow: 0 0 8px rgba(255,255,255,0.3); }
        .dot-blue { background: rgba(255,255,255,0.5); box-shadow: 0 0 6px rgba(255,255,255,0.2); }

        /* Compact table rows */
        .dash-card table td { padding: 8px 10px; font-size: 0.82rem; }
        .dash-card table th { padding: 8px 10px; font-size: 0.7rem; }

        .dash-card .card-header { padding: 12px 16px; }
        .dash-card .card-title { font-size: 0.85rem; }

        /* 52-week when badges */
        .when-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 500;
        }
        .when-today { background: rgba(255,255,255,0.1); color: #ffffff; }
        .when-recent { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
        .when-old { background: rgba(255,255,255,0.03); color: var(--text-muted); }

        /* 3-column layout for bottom */
        .grid-3-dash {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        @media (max-width: 1100px) { .grid-3-dash { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 700px) { .grid-3-dash { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="nav"></div>
    <div class="page">
        <div class="page-header">
            <h1 class="page-title">Dashboard</h1>
            <p class="page-subtitle">Real-time OSRS Grand Exchange overview</p>
        </div>


        <div class="dash-section">
            <span class="dash-section-title"><span class="dot dot-white"></span> Top Movers</span>
            <div class="tf-tabs" id="moverTabs">
                <button class="tf-tab active" data-days="1">24H</button>
                <button class="tf-tab" data-days="7">7D</button>
                <button class="tf-tab" data-days="30">30D</button>
                <button class="tf-tab" data-days="90">90D</button>
            </div>
        </div>
        <div class="grid-3-dash">
            <div class="card dash-card" id="gainersCard">
                <div class="card-header">
                    <span class="card-title">Gainers</span>
                    <span class="card-badge badge-green">Price Up</span>
                </div>
                <div class="loading"><div class="spinner"></div>Loading...</div>
            </div>
            <div class="card dash-card" id="losersCard">
                <div class="card-header">
                    <span class="card-title">Losers</span>
                    <span class="card-badge badge-red">Price Down</span>
                </div>
                <div class="loading"><div class="spinner"></div>Loading...</div>
            </div>
            <div class="card dash-card" id="volumeCard">
                <div class="card-header">
                    <span class="card-title">Volume Spikes</span>
                    <span class="card-badge badge-white">RVOL</span>
                </div>
                <div class="loading"><div class="spinner"></div>Loading...</div>
            </div>
        </div>

        <div class="dash-section">
            <span class="dash-section-title"><span class="dot dot-blue"></span> Price Extremes</span>
            <div class="tf-tabs" id="weekTabs">
                <button class="tf-tab active" data-days="7">Past Week</button>
                <button class="tf-tab" data-days="30">Past Month</button>
                <button class="tf-tab" data-days="90">Past 3 Months</button>
                <button class="tf-tab" data-days="365">Past Year</button>
            </div>
        </div>
        <div class="grid-2" id="weekSection" style="margin-bottom:24px">
            <div class="card dash-card" id="highsCard">
                <div class="card-header">
                    <span class="card-title">Highs</span>
                    <span class="card-badge badge-green">At High</span>
                </div>
                <div class="loading"><div class="spinner"></div>Scanning items...</div>
            </div>
            <div class="card dash-card" id="lowsCard">
                <div class="card-header">
                    <span class="card-title">Lows</span>
                    <span class="card-badge badge-red">At Low</span>
                </div>
                <div class="loading"><div class="spinner"></div>Scanning items...</div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('nav').innerHTML = GE.navHTML('Dashboard');
        GE.initAutocomplete();

        let _mapping, _now, _nowData;
        let _52weekItems = [];  // { id, meta, curPrice, pts }
        let _allMovers = [];
        let _curDays = 1;

        /* Fetch N evenly-spaced /1h snapshots across a baseline period.
           For short timeframes (<=7d), always use 7-day baseline for stability. */
        async function fetchVolumeSamples(days) {
            const baseDays = days <= 7 ? 7 : days;
            const count = baseDays <= 7 ? 5 : 6;
            const nowTs = Math.floor(Date.now() / 1000);
            const timestamps = [];
            for (let i = 1; i <= count; i++) {
                const daysBack = Math.round((i / count) * baseDays);
                const ts = nowTs - (daysBack * 86400);
                timestamps.push(ts - (ts % 3600));
            }
            return Promise.all(timestamps.map(ts =>
                GE.get1h(ts).then(d => d.data || d)
            ));
        }

        (async function () {
            try {
                const nowTs = Math.floor(Date.now() / 1000);
                const prevTs = nowTs - 86400;
                const alignedPrev = prevTs - (prevTs % 3600);

                // Kick off volume samples in parallel with main data
                const volSamplesP = fetchVolumeSamples(1);
                const [mapping, nowData, prevData] = await Promise.all([
                    GE.getMapping(),
                    GE.get1h(),
                    GE.get1h(alignedPrev)
                ]);
                const volSamples = await volSamplesP;

                _mapping = mapping;
                _nowData = nowData;
                _now = nowData.data || nowData;
                const prev = prevData.data || prevData;

                const { items } = computeMovers(_now, prev, mapping, volSamples);
                _allMovers = items;
                renderMovers(items, 1);

                scan52Week(_now, mapping);

                document.querySelectorAll('#moverTabs .tf-tab').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('#moverTabs .tf-tab').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        loadMovers(parseInt(btn.dataset.days));
                    });
                });

            } catch (err) {
                console.error(err);
                document.querySelectorAll('.loading').forEach(el => {
                    el.innerHTML = `<div class="error-msg">Failed to load data: ${err.message}</div>`;
                });
            }
        })();

        function computeMovers(now, prev, mapping, volSamples) {
            const items = [];
            Object.keys(now).forEach(id => {
                const n = now[id];
                const p = prev[id];
                const meta = mapping[id];
                if (!meta || !n) return;

                const curPrice = n.avgHighPrice || n.avgLowPrice;
                const prevPrice = p ? (p.avgHighPrice || p.avgLowPrice) : null;
                const curVol = (n.highPriceVolume || 0) + (n.lowPriceVolume || 0);

                if (!curPrice || !prevPrice || curPrice < 100) return;
                const pricePct = ((curPrice - prevPrice) / prevPrice) * 100;

                // RVOL: average hourly volume from sampled historical snapshots
                let volSum = 0, volCount = 0;
                if (volSamples) {
                    volSamples.forEach(snap => {
                        const s = snap[id];
                        if (s) {
                            const v = (s.highPriceVolume || 0) + (s.lowPriceVolume || 0);
                            if (v > 0) { volSum += v; volCount++; }
                        }
                    });
                }
                const avgVol = volCount > 0 ? volSum / volCount : 0;
                const volRatio = avgVol > 0 ? curVol / avgVol : 0;

                items.push({ id, meta, curPrice, prevPrice, pricePct, curVol, avgVol, volRatio });
            });
            return { items };
        }

        function renderMovers(items, days) {
            _curDays = days || _curDays;
            const sorted = [...items].sort((a, b) => b.pricePct - a.pricePct);
            const gainers = sorted.filter(i => i.pricePct > 0 && i.curVol >= 50).slice(0, 10);
            const losers = sorted.filter(i => i.pricePct < 0 && i.curVol >= 50).slice(-10).reverse();
            renderTable('gainersCard', gainers);
            renderTable('losersCard', losers);

            // RVOL filter: meaningful baseline, decent current volume, notable spike
            const volSorted = [...items]
                .filter(i => i.avgVol >= 10 && i.curVol >= 30 && i.volRatio >= 1.5)
                .sort((a, b) => b.volRatio - a.volRatio)
                .slice(0, 10);
            renderVolTable('volumeCard', volSorted, _curDays);
        }

        async function loadMovers(days) {
            const gc = document.getElementById('gainersCard');
            const lc = document.getElementById('losersCard');
            const vc = document.getElementById('volumeCard');

            const gcHeader = gc.querySelector('.card-header').outerHTML;
            const lcHeader = lc.querySelector('.card-header').outerHTML;
            const vcHeader = vc.querySelector('.card-header').outerHTML;
            gc.innerHTML = gcHeader + '<div class="loading"><div class="spinner"></div>Loading...</div>';
            lc.innerHTML = lcHeader + '<div class="loading"><div class="spinner"></div>Loading...</div>';
            vc.innerHTML = vcHeader + '<div class="loading"><div class="spinner"></div>Loading...</div>';

            try {
                const ago = Math.floor(Date.now() / 1000) - (days * 86400);
                const aligned = ago - (ago % 3600);
                const [prevData, volSamples] = await Promise.all([
                    GE.get1h(aligned),
                    fetchVolumeSamples(days)
                ]);
                const prev = prevData.data || prevData;
                const { items } = computeMovers(_now, prev, _mapping, volSamples);
                _allMovers = items;
                renderMovers(items, days);
            } catch (err) {
                gc.innerHTML = gcHeader + '<div class="error-msg">Failed to load</div>';
                lc.innerHTML = lcHeader + '<div class="error-msg">Failed to load</div>';
                vc.innerHTML = vcHeader + '<div class="error-msg">Failed to load</div>';
            }
        }

        function renderTable(containerId, data) {
            const el = document.getElementById(containerId);
            const header = el.querySelector('.card-header').outerHTML;
            if (!data.length) {
                el.innerHTML = header + '<div class="status-msg">No data</div>';
                return;
            }
            const activeTab = document.querySelector('#moverTabs .tf-tab.active');
            const days = activeTab ? parseInt(activeTab.dataset.days) : 1;
            const label = days === 1 ? '24h' : days + 'D';
            el.innerHTML = header + `<div class="table-wrap"><table>
                <thead><tr><th>Item</th><th>Price</th><th>${label}</th><th>Vol</th></tr></thead>
                <tbody>${data.map(i => `<tr>
                    <td><div class="item-cell">${GE.imgTag(i.meta)}<span class="item-name"><a href="item.html?id=${i.id}&days=${days}">${i.meta.name}</a></span>${GE.wikiLink(i.meta)}</div></td>
                    <td>${GE.fmtGp(i.curPrice)}</td>
                    <td class="${GE.pctClass(i.pricePct)}">${GE.fmtPct(i.pricePct)}</td>
                    <td>${GE.fmtGp(i.curVol)}</td>
                </tr>`).join('')}</tbody>
            </table></div>`;
        }

        function renderVolTable(containerId, data, days) {
            const el = document.getElementById(containerId);
            const header = el.querySelector('.card-header').outerHTML;
            if (!data.length) {
                el.innerHTML = header + '<div class="status-msg">No volume anomalies detected</div>';
                return;
            }
            const baseLabel = (days <= 7 ? '7' : days) + 'D Avg';
            el.innerHTML = header + `<div class="table-wrap"><table>
                <thead><tr><th>Item</th><th>Price</th><th>Vol Now</th><th>${baseLabel}</th><th>RVOL</th></tr></thead>
                <tbody>${data.map(i => {
                    const rClass = i.volRatio >= 5 ? '' : i.volRatio >= 2 ? 'positive' : 'neutral';
                    const rStyle = i.volRatio >= 5
                        ? 'color:#ffffff;font-weight:700;text-shadow:0 0 10px rgba(255,255,255,0.4)'
                        : 'font-weight:600';
                    return `<tr>
                    <td><div class="item-cell">${GE.imgTag(i.meta)}<span class="item-name"><a href="item.html?id=${i.id}&days=${days}">${i.meta.name}</a></span>${GE.wikiLink(i.meta)}</div></td>
                    <td>${GE.fmtGp(i.curPrice)}</td>
                    <td>${GE.fmtGp(i.curVol)}</td>
                    <td style="color:var(--text-muted)">${GE.fmtGp(Math.round(i.avgVol))}</td>
                    <td class="${rClass}" style="${rStyle}">${i.volRatio.toFixed(1)}x</td>
                </tr>`;}).join('')}</tbody>
            </table></div>`;
        }

        async function scan52Week(nowData, mapping) {
            try {
                const cached = GE.load52WeekCache();
                if (cached) {
                    _52weekItems = [];
                    cached.forEach(ci => {
                        const meta = mapping[ci.id];
                        if (!meta) return;
                        const d = nowData[ci.id];
                        const cur = d ? (d.avgHighPrice || d.avgLowPrice || 0) : 0;
                        _52weekItems.push({ id: ci.id, meta, curPrice: cur, pts: ci.pts });
                    });
                    filter52Week(7);
                    bindWeekTabs();
                    return;
                }

                const ranked = [];
                Object.keys(nowData).forEach(id => {
                    const d = nowData[id];
                    const meta = mapping[id];
                    if (!meta || !d) return;
                    const price = d.avgHighPrice || d.avgLowPrice || 0;
                    const vol = (d.highPriceVolume || 0) + (d.lowPriceVolume || 0);
                    if (price >= 200 && vol >= 20) ranked.push({ id, meta, curPrice: price, curVol: vol });
                });
                const highValue = [];
                Object.keys(nowData).forEach(id => {
                    const d = nowData[id];
                    const meta = mapping[id];
                    if (!meta || !d) return;
                    const price = d.avgHighPrice || d.avgLowPrice || 0;
                    if (price >= 100000 && !ranked.some(r => r.id === id)) {
                        highValue.push({ id, meta, curPrice: price, curVol: (d.highPriceVolume || 0) + (d.lowPriceVolume || 0) });
                    }
                });
                ranked.sort((a, b) => b.curVol - a.curVol);
                const candidates = [...ranked.slice(0, 250), ...highValue];

                const cacheEntries = [];
                _52weekItems = [];
                const BATCH = 10;

                for (let i = 0; i < candidates.length; i += BATCH) {
                    const batch = candidates.slice(i, i + BATCH);
                    const results = await Promise.all(
                        batch.map(async item => {
                            try {
                                const ts = await GE.getTimeseries(item.id, '24h');
                                return { item, data: ts.data || [] };
                            } catch { return { item, data: [] }; }
                        })
                    );

                    results.forEach(({ item, data }) => {
                        if (data.length < 30) return;
                        const pts = [];
                        data.forEach(d => { if (d.avgHighPrice) pts.push([d.timestamp, d.avgHighPrice]); });
                        if (pts.length < 30) return;
                        _52weekItems.push({ id: item.id, meta: item.meta, curPrice: item.curPrice, pts });
                        cacheEntries.push({ id: item.id, pts });
                    });
                    await new Promise(r => setTimeout(r, 200));
                }

                GE.save52WeekCache(cacheEntries);
                filter52Week(7);
                bindWeekTabs();

            } catch (err) {
                console.error('52-week scan error:', err);
                ['highsCard', 'lowsCard'].forEach(id => {
                    const el = document.getElementById(id);
                    const l = el.querySelector('.loading');
                    if (l) l.innerHTML = '<div class="status-msg">Failed to load</div>';
                });
            }
        }

        function bindWeekTabs() {
            document.querySelectorAll('#weekTabs .tf-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#weekTabs .tf-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filter52Week(parseInt(btn.dataset.days));
                });
            });
        }

        function filter52Week(windowDays) {
            const nowSec = Math.floor(Date.now() / 1000);
            const tol = 0.05;
            const highs = [], lows = [];
            _52weekItems.forEach(i => {
                if (!i.pts) return;
                const ex = GE.windowExtreme(i.pts, windowDays, nowSec);
                if (!ex) return;
                const cur = i.curPrice;
                if (cur >= ex.hi * (1 - tol)) {
                    highs.push({ ...i, extreme: ex.hi, daysAgo: Math.floor((nowSec - ex.hiT) / 86400), atExtreme: cur >= ex.hi });
                }
                if (cur <= ex.lo * (1 + tol)) {
                    lows.push({ ...i, extreme: ex.lo, daysAgo: Math.floor((nowSec - ex.loT) / 86400), atExtreme: cur <= ex.lo });
                }
            });
            // Closest to the extreme first
            highs.sort((a, b) => (b.curPrice / b.extreme) - (a.curPrice / a.extreme));
            lows.sort((a, b) => (a.curPrice / a.extreme) - (b.curPrice / b.extreme));
            render52('highsCard', highs.slice(0, 15), true, windowDays);
            render52('lowsCard', lows.slice(0, 15), false, windowDays);
        }

        function render52(containerId, data, isHighs, windowDays) {
            const el = document.getElementById(containerId);
            const header = el.querySelector('.card-header').outerHTML;
            if (!data.length) {
                el.innerHTML = header + '<div class="status-msg">No items near their ' + (isHighs ? 'high' : 'low') + ' in this window</div>';
                return;
            }
            el.innerHTML = header + `<div class="table-wrap"><table>
                <thead><tr><th>Item</th><th>Price</th><th>${isHighs ? 'High' : 'Low'}</th><th>When</th></tr></thead>
                <tbody>${data.map(i => {
                    const daysAgo = i.daysAgo;
                    const when = daysAgo === 0 ? 'Today' : daysAgo === 1 ? 'Yesterday' : daysAgo + 'd ago';
                    const whenClass = daysAgo === 0 ? 'when-today' : daysAgo <= 3 ? 'when-recent' : 'when-old';
                    const extremeClass = i.atExtreme ? (isHighs ? 'positive' : 'negative') : '';
                    return `<tr>
                    <td><div class="item-cell">${GE.imgTag(i.meta)}<span class="item-name"><a href="item.html?id=${i.id}&days=${windowDays}">${i.meta.name}</a></span>${GE.wikiLink(i.meta)}</div></td>
                    <td>${GE.fmtGp(i.curPrice)}</td>
                    <td class="${extremeClass}">${GE.fmtGp(i.extreme)}</td>
                    <td><span class="when-badge ${whenClass}">${when}</span></td>
                </tr>`;}).join('')}</tbody>
            </table></div>`;
        }
    </script>
</body>
</html>

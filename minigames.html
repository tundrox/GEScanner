    <style>
        /* Skills | Minigames: section tabs, as on Trading and Scanner */

        .calc-form + .calc-form { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
        .calc-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .calc-field > span { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); font-weight: 600; }
        .calc-field > span.hint { font-size: 0.68rem; color: var(--text-muted); line-height: 1.4; text-transform: none; letter-spacing: normal; font-weight: 400; }
        .calc-field.check { justify-content: flex-end; }
        .calc-field.check .checkbox-label { height: 33px; white-space: normal; }
        .calc-pair { display: flex; gap: 6px; }
        .calc-pair input { min-width: 0; }
        .calc-pair input.lvl { width: 72px; flex-shrink: 0; }

        .calc-quick { display: flex; flex-wrap: wrap; gap: 4px; }

            padding: 3px 9px; border-radius: 12px; font-size: 0.7rem; cursor: pointer; font-family: inherit;
            border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: var(--text-secondary);
        }
        .calc-quick button:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .calc-rsn-status { font-size: 0.72rem; color: var(--text-muted); min-height: 1em; }
        .calc-rsn-status.error { color: var(--red); }

        .mg-tables { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; margin-bottom: 12px; align-items: start; }
        .mg-tables.single { grid-template-columns: minmax(0, 1fr); }
        .calc-table .muted { color: var(--text-muted); }
        .calc-table .tag-sm { font-size: 0.62rem; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; padding: 0 4px; flex-shrink: 0; }
        /* Total under a list, lined up with its last column */
        .mg-total { display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums; }

        .calc-note .warn { color: #f59e0b; }
        .calc-status { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

        @media (max-width: 1000px) {

        @media (max-width: 700px) {
            .mg-picker { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
            .calc-skill .sk { display: none; }
            .calc-form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
            .calc-form > .calc-field:first-child, .calc-form > .calc-field.check, .calc-form > .calc-field:has(.hint) { grid-column: 1 / -1; }
            .calc-pair input.lvl, .calc-pair input[type="number"].lvl { width: 52px; }
        }

<body>

        <div class="card" style="margin-bottom:12px">
            <div class="card-header">
                <span class="card-title" id="mgTitle">Minigame Calculator</span>

            </div>
            <div class="calc-form">
                <label class="calc-field">
                    <span>RuneScape name</span>
                    <div class="calc-pair">
                        <input type="text" id="mgRsn" class="xp" placeholder="Optional — fills your levels" maxlength="12" autocomplete="off" spellcheck="false">

                    <div class="calc-pair">
                        <input type="number" id="mgTgtLvl" class="lvl" min="1" max="126" value="2">

                    </div>

                        <button type="button" data-t="next">Next</button>

                <label class="calc-field" id="mgAmountField">
                    <span id="mgAmountLabel">Amount</span>
                    <input type="text" id="mgAmount" autocomplete="off">
                    <span class="hint" id="mgAmountHint"></span>
                </label>
                <label class="calc-field">
                    <span>Prices</span>

        <div class="stats-row" id="mgStats"></div>

        <div class="mg-tables" id="mgTables"></div>

        <div class="card">
            <div class="calc-note" id="mgNote" style="margin-top:0"></div>

    <script src="js/api.js"></script>
    <script src="js/skills.js"></script>
    <script src="data/minigames.js"></script>
    <script>
    (async () => {
        document.getElementById('nav').innerHTML = GE.navHTML('Calculators');
        GE.initAutocomplete();

        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const RSN_KEY = 'ge_calc_rsn';
        const D = (window.OSRS_DATA || {}).minigames;
        if (!D) {
            $('mgStats').innerHTML = '';
            $('mgTables').innerHTML = '<div class="card calc-status">Couldn\'t load data/minigames.js — the calculator data is missing from this copy of the site.</div>';
            return;
        }

        // ---------- Prices ----------
        const [mapping, latestData] = await GE.preload();
        const latest = latestData.data;
        const byName = {};
        for (const item of Object.values(mapping)) byName[item.name.toLowerCase()] = item;
        // Wiki names that differ from the GE's
        const ALIAS = { 'tome of fire': 'tome of fire (empty)' };
        const itemFor = name => { const k = String(name).toLowerCase(); return byName[ALIAS[k] || k] || null; };
        const instant = () => $('mgPrices').value === 'instant';
        function buyPrice(name) {
            if (name === 'Coins') return 1;
            const it = itemFor(name), p = it && latest[it.id];
            if (!p) return null;
            return instant() ? (p.high || p.low) : (p.low || p.high);
        }
        // Net value of one when sold (after GE tax); containers are worth their expected contents
        const CONTAINERS = Object.assign({}, D.tempoross.containers, D.guardians.containers,
            { 'Bird nest (seeds)': D.birdhouses.seedNestTable, 'Bird nest (ring)': D.birdhouses.ringNestTable });
        function valueOf(name, depth) {
            if (name === 'Coins') return { each: 1, net: 1 };
            const it = itemFor(name), p = it && latest[it.id];
            if (it) {
                const s = p ? (instant() ? (p.low || p.high) : (p.high || p.low)) : null;
                return s == null ? { each: null, net: null, item: it } : { each: s, net: s - GE.geTax(s), item: it };
            }
            if (CONTAINERS[name] && !depth) {
                let v = 0;
                for (const x of CONTAINERS[name]) { const c = valueOf(x.item, 1); if (c.net) v += x.p * (x.lo + x.hi) / 2 * c.net; }
                return { each: v, net: v, container: true };
            }
            return { each: null, net: null };
        }

        // ---------- Wiki formulas ----------
        const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        const floor1 = n => Math.floor(n * 10 + 1e-9) / 10;          // the game floors XP to 0.1
        // Module:Skilling success chart p.interp
        const interp = (low, high, L) => clamp((Math.floor(low * (99 - L) / 98 + high * (L - 1) / 98 + 0.5) + 1) / 256, 0, 1);
        // Module:Herbiboar p.interp — the same, but Lua's math.modf truncates toward zero
        const interpTrunc = (low, high, L) => clamp((1 + Math.trunc(low * (99 - L) / 98 + high * (L - 1) / 98 + 0.5)) / 256, 0, 1);
        // Linear between a table's [level, value] points, flat beyond its ends
        function between(points, L) {
            if (!points.length) return null;
            if (L <= points[0][0]) return points[0][1];
            for (let i = 1; i < points.length; i++) {
                const [l0, v0] = points[i - 1], [l1, v1] = points[i];
                if (L <= l1) return v0 + (v1 - v0) * (L - l0) / (l1 - l0);
            }
            return points[points.length - 1][1];
        }
        const avg = r => (r.lo + r.hi) / 2;
        const wikiLink = (page, text) => `<a href="${GE.wikiUrl(page)}" target="_blank" rel="noopener noreferrer">${esc(text || page)}</a>`;

        // ---------- Calculators ----------
        // unit(L, c) returns what one unit (a game, a bar, a permit...) gives at main-skill level L:
        //   { xp: { skill: xp }, loot: [[item, qty]], cost: [[item, qty]], fees: [[label, gp]], gp, rate }
        // where rate is units per hour. c.v holds the inputs, c.rate(L) the units per hour.
        const BF = D.blastFurnace, CB = D.cannonballs, GF = D.giantsFoundry, SG = D.superglass, WT = D.wintertodt,
            TP = D.tempoross, GR = D.guardians, ML = D.motherlode, BH = D.birdhouses, HB = D.herbiboar, TF = D.titheFarm, ZA = D.zalcano,
            PP = D.pickpocketing, ZM = D.zmi, HS = D.sepulchre, BM = D.blastMine, VT = D.valeTotems, PL = D.pyramidPlunder, HE = D.hespori;

        // Giants' Foundry (Module:Giants' Foundry Calculator)
        const gfXp = q => (Math.floor(q * q / 73) + Math.floor(1.5 * q) + 1) * 30;
        function gfMetalScore(t1, t2, a1, a2) {
            let v1, v2;
            if (t2 === t1 || t2 === 0) { v1 = 10 * t1; v2 = 0; } else { v1 = 10 * t1 * a1 / 28; v2 = 10 * t2 * a2 / 28; }
            return Math.floor((Math.floor(10 * v1) + Math.floor(10 * v2) + Math.floor(v1 * v2)) / 10);
        }
        function gfSections(score) {
            for (const [below, n] of GF.difficulty) if (score < below) return n;
            return GF.maxSections;
        }
        function gfAverage(L, allMoulds, metal) {
            let q = 0, xp = 0;
            for (const [a, b, freq] of GF.requests) {
                let score = metal;
                for (const type of ['Forte', 'Blade', 'Tip']) {
                    let best = 0;
                    for (const m of GF.moulds) if (m.t === type && m.l <= L && (m.d || allMoulds)) best = Math.max(best, m.s[a] + m.s[b]);
                    score += best;
                }
                q += freq * score / 24;
                xp += freq * gfXp(score) / 24;
            }
            return { q, xp };
        }
        function gfMetals(v) {
            let t1 = GF.barTier[v.metal1], t2 = GF.barTier[v.metal2], a1 = clamp(Math.round(+v.bars1 || 0), 0, 28), a2 = 28 - a1;
            if (t2 === 0 && a2 > 0) { a1 = 28; a2 = 0; }             // as the wiki calculator: no second metal means 28 of the first
            if (t1 === t2) { a1 = 28; a2 = 0; }
            return { t1, t2, a1, a2, score: gfMetalScore(t1, t2, a1, a2) };
        }
        const gfPrefix = m => m === 'Runite' ? 'Rune' : m === 'Adamantite' ? 'Adamant' : m;
        // Cheapest way to bring `amount` bars of a metal: the bars, or items that melt into them
        function gfSource(metal, amount, cheapest) {
            const bar = metal + ' bar', barPrice = buyPrice(bar);
            let best = { item: bar, qty: amount, price: barPrice };
            if (!cheapest || barPrice == null) return best;
            for (const [type, worth] of Object.entries(GF.itemBarWorth)) {
                const name = gfPrefix(metal) + ' ' + type, price = buyPrice(name);
                if (price != null && price * amount / worth < best.price * best.qty) best = { item: name, qty: amount / worth, price };
            }
            return best;
        }

        // Wintertodt reward cart (Reward Cart page + Module:Wintertodt supply crate)
        function wtRollLoot(c) {
            const v = c.v, out = [];
            let none = 1;                                             // chance no unique roll succeeds
            for (const u of WT.chain) {
                if (u.item === 'Phoenix' && v.hasPhoenix) continue;
                const p = u.p * none;
                none *= 1 - u.p;
                const pyro = v.sellPyro ? [['Burnt page', 50 * p]] : null;
                if (u.item === 'Warm gloves') out.push(...(v.gloves3 ? [['Magic seed', p]] : pyro || [['Warm gloves', p]]));
                else if (u.item === 'Bruma torch') out.push(...(v.torches3 ? [['Torstol seed', p * (WT.torstolSeeds[0] + WT.torstolSeeds[1]) / 2]] : pyro || [['Bruma torch', p]]));
                else if (u.item === 'Pyromancer outfit') out.push(...(pyro || [['Pyromancer outfit', p]]));
                else if (u.item === 'Burnt page') out.push(['Burnt page', p * (WT.burntPages[0] + WT.burntPages[1]) / 2]);
                else out.push([u.item, p]);
            }
            for (const [skill, t] of Object.entries(WT.sub)) {
                const L = c.lvl(skill);
                let left = 1;
                for (const it of t.items) {
                    const raw = Math.floor(it.low + (it.high - it.low) * (L - 1) / 98);
                    const chance = left * clamp(raw + 1, 0, 256) / 256;
                    left -= chance;
                    if (chance > 0) out.push([it.item, none * t.p * chance * (it.lo + it.hi) / 2]);
                }
            }
            for (const o of WT.other) out.push([o.item, none * o.p * avg(o)]);
            return out;
        }

        // Tempoross XP per hour from the wiki's table for the harpoon (falls back to the regular harpoon below its first level)
        function tpXpPerHour(L, v) {
            const table = TP.rates[v.cook ? 'cooked' : 'raw'];
            const h = table.find(t => t.harpoon === v.harpoon) || table[0];
            const pts = L < h.points[0][0] ? table[0].points : h.points;
            return between(pts, L);
        }
        const tpBand = L => { const keys = Object.keys(TP.fish).map(Number).sort((a, b) => a - b); return keys.filter(k => k <= L).pop() || keys[0]; };
        const tpCatchXp = L => {
            const b = L > TP.catchXp.high.above ? TP.catchXp.high : TP.catchXp.low;
            return Math.trunc(b.base + (1000 - b.base) * (L - b.level) / (99 - b.level));
        };

        // Guardians of the Rift XP per hour by level band (Runecraft training guide)
        const grBand = L => GR.xpRates.find(b => L >= b.from && L <= b.to) || (L < GR.xpRates[0].from ? GR.xpRates[0] : GR.xpRates[GR.xpRates.length - 1]);

        // Motherlode Mine ores: rolled from the top tier you can get, coal if every roll fails
        function mlOres(L, diary) {
            const out = [];
            let rate = 1, total = 0;
            const boost = { 'Runite ore': 0.01, 'Adamantite ore': 0.02, 'Mithril ore': 0.01 };
            for (const o of ML.chart) {
                if (o.label === 'Coal') continue;
                if (L < o.req) continue;
                const p = interp(o.low, o.high, L);
                let chance = rate * p;
                rate *= 1 - p;
                if (diary && boost[o.label]) chance += boost[o.label];
                out.push([o.label, chance]);
                total += chance;
            }
            out.push(['Coal', Math.max(0, 1 - total)]);
            return out;
        }

        // Bird houses
        const bhBest = L => BH.types.filter(t => t.level <= L).pop() || BH.types[0];
        const bhNestRoll = (high, L) => Math.trunc(high * (Math.max(50, L) - 1) / 98) / 1000;
        function bhCheapestSeed() {
            let best = null;
            for (const s of BH.seeds) {
                const p = buyPrice(s.seed);
                if (p != null && (!best || p * s.qty < best.cost)) best = { seed: s.seed, qty: s.qty, cost: p * s.qty };
            }
            return best || { seed: BH.seeds[0].seed, qty: BH.seeds[0].qty, cost: null };
        }

        // Herbiboar (Module:Herbiboar)
        function hbHunterXp(L) {
            const f = HB.hunterXp;
            let xp = f.base + f.searches * f.searchXp + f.perLevel * Math.min(L, f.cap);
            if (L > f.cap) xp += f.at95 + f.after95 * (L - (f.cap + 1));
            return xp;
        }
        function hbHerbs(L) {
            const out = [];
            let rate = 1;
            for (const h of HB.chances) {
                const p = interpTrunc(h.low, h.high, L);
                out.push([h.herb, rate * p]);
                if (L >= h.req) rate *= 1 - p;
            }
            return out;
        }

        const tfSeed = (L, v) => (v.seed && v.seed !== 'auto' ? TF.seeds.find(s => s.seed === v.seed) : TF.seeds.filter(s => s.level <= L).pop()) || TF.seeds[0];
        function tfXp100(s, outfit) {
            const boost = outfit ? 1 + TF.outfitBoost / 100 : 1;
            // Fruit 1–74 give the deposit XP, 75–100 double, plus the 75th-fruit bonus (not boosted)
            return floor1(s.harvest * boost) * 100 + floor1(s.deposit * boost) * 74 + floor1(2 * s.deposit * boost) * 26 + s.bonus;
        }

        const CALCS = [
            {
                key: 'blastFurnace', name: 'Blast Furnace', skill: 'smithing', min: 30, icon: 'Runite bar', units: ['bar', 'bars'], data: BF,
                inputs: [
                    { id: 'bar', label: 'Bar', type: 'select', def: 'Steel', options: () => BF.bars.map(b => [b.name, `${b.name} (level ${b.level})`]) },
                    { id: 'coalBag', label: 'Coal bag', type: 'check', def: true, text: 'Using a coal bag', show: v => !!bfBar(v).coalBag },
                    { id: 'rate', label: 'Bars per hour', type: 'rate', auto: c => { const b = bfBar(c.v), r = (c.v.coalBag && b.coalBag) || b.perHour; return Math.round((r[0] + r[1]) / 2); },
                        hint: c => { const b = bfBar(c.v), r = (c.v.coalBag && b.coalBag) || b.perHour; return `Wiki range ${r[0].toLocaleString()}–${r[1].toLocaleString()} an hour; the midpoint is used`; } }
                ],
                unit(L, c) {
                    const b = bfBar(c.v), rate = c.rate(L);
                    const fees = [[`Coffer (${GE.fmtGp(BF.coffer)}/h)`, BF.coffer / rate]];
                    if (L < BF.fee.level) fees.push([`Foreman fee (under ${BF.fee.level} Smithing)`, BF.fee.gp * 60 / BF.fee.minutes / rate]);
                    return { xp: { smithing: b.xp }, loot: [[b.bar, 1]], cost: b.ores, fees, rate };
                },

                    return levelFromPlayer(skill) || 1;
                },
                // A typed number, or the input's automatic (wiki) value at level L
                num: (id, L) => {
                    const typed = parseFloat(String(v[id] ?? '').replace(/,/g, ''));
                    if (Number.isFinite(typed) && typed > 0) return typed;
                    const inp = x.inputs.find(i => i.id === id);
                    return inp && inp.auto ? inp.auto(c, L ?? c.level) : 0;
                }
            };
            c.rate = L => Math.max(1e-6, c.num('rate', L));
            return c;
        }

        function renderInputs() {
            const x = calc(), v = values(), c = context();
            $('mgInputs').innerHTML = x.inputs.map(inp => {
                if (inp.show && !inp.show(v)) return '';
                const id = 'in_' + inp.id;
                if (inp.type === 'select') {
                    return `<label class="calc-field"><span>${esc(inp.label)}</span><select id="${id}" data-in="${inp.id}">${inp.options(v).map(([val, text]) =>
                        `<option value="${esc(val)}"${String(v[inp.id]) === String(val) ? ' selected' : ''}>${esc(text)}</option>`).join('')}</select></label>`;
                }
                if (inp.type === 'check') {
                    return `<div class="calc-field check"><span>${esc(inp.label)}</span><label class="checkbox-label"><input type="checkbox" id="${id}" data-in="${inp.id}"${v[inp.id] ? ' checked' : ''}> ${esc(inp.text)}</label></div>`;
                }
                if (inp.type === 'rate') {
                    const auto = inp.auto(c, c.level);
                    return `<label class="calc-field"><span>${esc(inp.label)}</span><input type="text" id="${id}" data-in="${inp.id}" value="${esc(v[inp.id])}" placeholder="${esc(fmtNum(auto))} (wiki)" autocomplete="off">`
                        + `${inp.hint ? `<span class="hint">${inp.hint(c)}</span>` : ''}</label>`;
                }
                const attrs = inp.type === 'level' ? 'min="1" max="99"' : `min="${inp.min ?? 0}" max="${inp.max ?? ''}"`;
                return `<label class="calc-field"><span>${esc(inp.label)}</span><input type="number" id="${id}" data-in="${inp.id}" ${attrs} value="${esc(v[inp.id])}"></label>`;
            }).join('');
            $('mgInputs').style.display = $('mgInputs').innerHTML ? '' : 'none';
            $('mgInputs').querySelectorAll('[data-in]').forEach(el => {
                el.addEventListener(el.type === 'text' ? 'input' : 'change', () => {
                    const inp = x.inputs.find(i => i.id === el.dataset.in);
                    v[inp.id] = el.type === 'checkbox' ? el.checked : el.value;
                    if (el.type !== 'text') renderInputs();          // dependent fields and hints
                    render();
                });
            });
        }

        // ---------- Level / XP / goal fields ----------
        function syncGoal() {
            const x = calc(), hasSkill = !!x.skill;
            const goal = goalOf(x);
            $('mgGoal').value = goal;
            $('mgGoal').disabled = goal !== (state.goal[x.key] || 'target') || !hasSkill;
            $('mgCurField').style.display = hasSkill ? '' : 'none';
            $('mgTgtField').style.display = hasSkill && goal === 'target' ? '' : 'none';
            $('mgAmountField').style.display = goal === 'amount' ? '' : 'none';
            if (hasSkill) {
                $('mgCurLabel').textContent = `Current ${OSRS.skillName(x.skill)} level / XP`;
                $('mgCurLvl').value = OSRS.levelForXp(curXp());
                $('mgCurXp').value = curXp().toLocaleString();
                $('mgTgtLvl').value = OSRS.levelForXp(tgtXp());
                $('mgTgtXp').value = tgtXp().toLocaleString();
            }
            $('mgAmountLabel').textContent = 'Number of ' + x.units[1];
            $('mgAmount').value = state.amount[x.key] ?? '';
            const c = context();
            $('mgAmount').placeholder = fmtNum(Math.round(x.unit(c.level, c).rate)) + ' (one hour)';
        }
        function setCur(xp) { const k = calc().skill; state.xp[k] = clampXp(xp); syncGoal(); renderInputs(); render(); }
        function setTgt(xp) { state.tgt[calc().skill] = clampXp(xp); syncGoal(); render(); }
        $('mgCurLvl').onchange = () => setCur(OSRS.xpForLevel(+$('mgCurLvl').value || 1));
        $('mgCurXp').onchange = () => setCur(GE.parseGp($('mgCurXp').value));
        $('mgTgtLvl').onchange = () => setTgt(OSRS.xpForLevel(+$('mgTgtLvl').value || 1));
        $('mgTgtXp').onchange = () => setTgt(GE.parseGp($('mgTgtXp').value));
        $('mgQuick').querySelectorAll('button').forEach(b => b.onclick = () => {
            const t = b.dataset.t;
            setTgt(t === 'next' ? OSRS.xpForLevel(Math.min(OSRS.MAX_LEVEL, OSRS.levelForXp(curXp()) + 1)) : OSRS.xpForLevel(+t));
        });
        $('mgGoal').onchange = () => { state.goal[calc().key] = $('mgGoal').value; syncGoal(); render(); };
        $('mgAmount').oninput = () => { state.amount[calc().key] = $('mgAmount').value; render(); };
        $('mgPrices').onchange = () => { renderInputs(); render(); };

        // ---------- Player lookup ----------
        async function loadPlayer(rsn) {
            rsn = String(rsn || '').trim();
            const st = $('mgRsnStatus');
            if (!rsn) { player = null; st.textContent = ''; return; }
            if (!OSRS.validRsn(rsn)) { st.className = 'calc-rsn-status error'; st.textContent = OSRS.errorText({ code: 'INVALID_USERNAME' }); return; }
            st.className = 'calc-rsn-status';
            st.textContent = 'Loading ' + rsn + '...';
            try {
                player = await OSRS.getPlayer(rsn);
                if (Date.now() - new Date(player.updatedAt).getTime() > 60 * 60 * 1000) {
                    st.textContent = 'Refreshing ' + player.displayName + ' from the hiscores...';
                    try { player = await OSRS.updatePlayer(rsn); } catch (e) { /* stored stats are still usable */ }
                }
            } catch (e) {
                player = null;
                st.className = 'calc-rsn-status error';
                st.textContent = OSRS.errorText(e);
                return;
            }
            try { localStorage.setItem(RSN_KEY, player.displayName); } catch (e) { /* ignore */ }
            $('mgRsn').value = player.displayName;
            st.innerHTML = `${esc(player.displayName)} · updated ${OSRS.timeAgo(player.updatedAt)} · <a href="hiscores.html?rsn=${encodeURIComponent(player.displayName)}">hiscores</a>`;
            // Every skill's XP, and the level fields of every calculator
            for (const [k] of OSRS.SKILLS) {
                const s = player.latestSnapshot.data.skills[k];
                if (s && s.experience >= 0) state.xp[k] = s.experience;
            }
            state.tgt = {};
            for (const x of CALCS) {
                const v = state.values[x.key];
                if (!v) continue;
                for (const inp of x.inputs) if (inp.type === 'level') { const l = levelFromPlayer(inp.skill); if (l) v[inp.id] = l; }
            }
            updateUrl();
            syncGoal(); renderInputs(); render();
        }
        $('mgLoad').onclick = () => loadPlayer($('mgRsn').value);
        $('mgRsn').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); loadPlayer($('mgRsn').value); } };

        function updateUrl() {
            const q = new URLSearchParams({ calc: state.calc });
            if (player) q.set('rsn', player.displayName);
            history.replaceState(null, '', '?' + q);
        }

        // ---------- Simulation ----------
        // Adds up units level by level, so XP per unit, loot and rates follow the main skill as it rises
        function simulate(x, c) {
            const goal = goalOf(x);
            const cache = {};
            const at = L => cache[L] || (cache[L] = x.unit(L, c));
            const t = { units: 0, hours: 0, xp: {}, loot: {}, cost: {}, fees: {}, gp: 0, extra: {}, first: at(c.level) };
            const add = (u, n) => {
                t.units += n; t.hours += n / u.rate;
                for (const [k, q] of Object.entries(u.xp || {})) t.xp[k] = (t.xp[k] || 0) + q * n;
                for (const [i, q] of u.loot || []) t.loot[i] = (t.loot[i] || 0) + q * n;
                for (const [i, q] of u.cost || []) t.cost[i] = (t.cost[i] || 0) + q * n;
                for (const [i, g] of u.fees || []) t.fees[i] = (t.fees[i] || 0) + g * n;
                t.gp += (u.gp || 0) * n;
                for (const [k, q] of Object.entries(u.extra || {})) t.extra[k] = (t.extra[k] || 0) + q * n;
            };
            let xp = curXp();
            const levelAt = xp => Math.min(99, OSRS.levelForXp(xp, 99));
            if (goal === 'target') {
                const tgt = tgtXp();
                if (tgt <= xp) return { done: true };
                for (let guard = 0; xp < tgt && guard < 200; guard++) {
                    const L = levelAt(xp), u = at(L), per = (u.xp || {})[x.skill];
                    if (!per || per <= 0) return { noXp: true };
                    const next = L < 99 ? Math.min(tgt, OSRS.xpForLevel(L + 1)) : tgt;
                    const n = Math.ceil((next - xp) / per - 1e-9);
                    add(u, n);
                    xp += n * per;
                }
            } else {
                let left = Math.max(0, parseFloat(String(state.amount[x.key] ?? '').replace(/,/g, '')) || Math.max(1, Math.round(at(c.level).rate)));
                for (let guard = 0; left > 0 && guard < 200; guard++) {
                    const L = levelAt(xp), u = at(L), per = x.skill ? (u.xp || {})[x.skill] || 0 : 0;
                    let n = left;
                    if (per > 0 && L < 99) n = Math.min(left, Math.max(1, Math.ceil((OSRS.xpForLevel(L + 1) - xp) / per - 1e-9)));
                    add(u, n);
                    xp += n * per;
                    left -= n;
                }
            }
            t.endXp = xp;
            return t;
        }

        // ---------- Rendering ----------
        const fmtNum = n => n == null || !Number.isFinite(n) ? '—' : n >= 100 ? Math.round(n).toLocaleString() : n >= 10 ? n.toFixed(1).replace(/\.0$/, '') : n.toFixed(2).replace(/\.?0+$/, '');
        // Expected quantities: whole numbers once they're large, a few decimals when they're small
        const fmtQty = q => q >= 100 ? Math.round(q).toLocaleString() : q >= 1 ? q.toFixed(1).replace(/\.0$/, '') : q >= 0.01 ? q.toFixed(2) : q >= 0.001 ? q.toFixed(3) : '<0.001';
        function fmtHours(h) {
            if (!Number.isFinite(h)) return '—';
            if (h < 1) return Math.max(1, Math.round(h * 60)) + 'm';
            if (h < 100) { const m = Math.round((h % 1) * 60); return Math.floor(h) + 'h' + (m ? ' ' + m + 'm' : ''); }
            return Math.round(h).toLocaleString() + 'h';
        }
        const signed = n => {
            if (n == null || !Number.isFinite(n)) return '<span class="muted">—</span>';
            const cls = n > 0 ? 'positive' : n < 0 ? 'negative' : 'neutral';
            return `<span class="${cls}">${n > 0 ? '+' : n < 0 ? '−' : ''}${GE.fmtGp(Math.round(Math.abs(n)))}</span>`;
        };
        const chance = q => q >= 5 ? '' : (() => { const p = 1 - Math.exp(-q); return p > 0.9995 ? '≈100%' : (p * 100 >= 10 ? (p * 100).toFixed(0) : (p * 100).toFixed(1)) + '%'; })();
        const statCard = (label, value, sub) => `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-sub">${sub || ''}</div></div>`;

        function itemCell(name, note) {
            const it = itemFor(name);
            // Coins aren't a GE item, so there's no local icon; use the wiki's
            const icon = it ? GE.imgTag(it, 22) : name === 'Coins' ? `<img src="${GE.WIKI_IMG}Coins_10000.png" width="22" height="22" class="item-icon" loading="lazy" alt="">`
                : `<span class="item-icon-fallback" style="width:22px;height:22px">${esc(name[0])}</span>`;
            const label = it ? `<a href="item.html?id=${it.id}">${esc(name)}</a>` : esc(name);
            return `<div class="item-cell">${icon}<span class="item-name">${label}</span>${note ? `<span class="tag-sm">${note}</span>` : ''}${GE.wikiLink(it ? it.name : name.replace(/#.*/, ''))}</div>`;
        }

        function lootTable(sim, x) {
            const rows = Object.entries(sim.loot).filter(([, q]) => q > 1e-9).map(([name, qty]) => {
                const v = valueOf(name);
                return { name, qty, each: v.net, total: v.net == null ? null : v.net * qty, container: v.container };
            });
            const { col, dir } = state.sort, d = dir === 'asc' ? 1 : -1;
            rows.sort((a, b) => col === 'name' ? a.name.localeCompare(b.name) * d
                : (a[col] == null) - (b[col] == null) || ((a[col] ?? 0) - (b[col] ?? 0)) * d || b.qty - a.qty);
            const total = rows.reduce((s, r) => s + (r.total || 0), 0) + sim.gp;
            const th = (k, label, num) => `<th data-sort="${k}" class="${num ? 'num ' : ''}${col === k ? 'sorted-' + dir : ''}">${label}</th>`;
            let h = `<div class="card"><div class="card-header"><span class="card-title">Loot</span><span class="card-badge badge-white">${fmtNum(sim.units)} ${sim.units === 1 ? x.units[0] : x.units[1]}</span></div>`;
            h += '<div class="table-wrap"><table class="calc-table"><thead><tr>' + th('name', 'Item') + th('qty', 'Qty', 1) + '<th class="num" style="cursor:default">Chance of 1+</th>' + th('each', 'Each (net)', 1) + th('total', 'Total', 1) + '</tr></thead><tbody>';
            if (sim.gp) h += `<tr><td>${itemCell('Coins', 'reward')}</td><td class="num">${Math.round(sim.gp).toLocaleString()}</td><td></td><td class="num">1</td><td class="num">${signed(sim.gp)}</td></tr>`;
            for (const r of rows) {
                h += `<tr><td>${itemCell(r.name, r.container ? 'contents' : '')}</td><td class="num">${fmtQty(r.qty)}</td><td class="num muted"${chance(r.qty) ? '' : ' data-label=""'}>${chance(r.qty)}</td>`
                    + `<td class="num">${r.each == null ? '<span class="muted">not on GE</span>' : (r.container ? '≈' : '') + GE.fmtGp(Math.round(r.each))}</td><td class="num">${signed(r.total)}</td></tr>`;
            }
            if (!rows.length && !sim.gp) h += '<tr><td colspan="5" class="muted">No loot</td></tr>';
            h += `</tbody></table></div><div class="mg-total"><span>Total after 2% tax</span><span>${signed(total)}</span></div></div>`;
            return { html: h, total };
        }

        function costTable(sim) {
            const rows = Object.entries(sim.cost).filter(([, q]) => q > 1e-9).map(([name, qty]) => {
                const p = buyPrice(name);
                return { name, qty, each: p, total: p == null ? null : p * qty };
            }).sort((a, b) => (b.total ?? -1) - (a.total ?? -1));
            const fees = Object.entries(sim.fees);
            if (!rows.length && !fees.length) return { html: '', total: 0, unknown: false };
            let total = 0, unknown = false;
            let h = '<div class="card"><div class="card-header"><span class="card-title">Supplies</span></div><div class="table-wrap"><table class="calc-table"><thead><tr><th style="cursor:default">Item</th><th class="num" style="cursor:default">Qty</th><th class="num" style="cursor:default">Each</th><th class="num" style="cursor:default">Cost</th></tr></thead><tbody>';
            for (const r of rows) {
                if (r.total == null) unknown = true; else total += r.total;
                h += `<tr><td>${itemCell(r.name)}</td><td class="num">${fmtQty(Math.ceil(r.qty - 1e-9))}</td><td class="num">${r.each == null ? '<span class="muted">not on GE</span>' : GE.fmtGp(r.each)}</td><td class="num">${r.total == null ? '<span class="muted">—</span>' : signed(-r.total)}</td></tr>`;
            }
            for (const [label, gp] of fees) {
                total += gp;
                h += `<tr><td><div class="item-cell"><span class="item-name muted" title="${esc(label)}">${esc(label)}</span></div></td><td class="num">${Math.round(gp).toLocaleString()}</td><td class="num">1</td><td class="num">${signed(-gp)}</td></tr>`;
            }
            h += `</tbody></table></div><div class="mg-total"><span>Total</span><span>${signed(-total)}</span></div></div>`;
            return { html: h, total, unknown };
        }

        function render() {
            const x = calc(), c = context();
            $('mgTitle').textContent = x.name + ' Calculator';
            const sim = simulate(x, c);
            const note = (x.notes ? x.notes(c) : []);
            $('mgSources').innerHTML = 'Sources (OSRS Wiki): ' + x.data.src.map(p => {
                const r = D.revisions[p];
                return wikiLink(p) + (r ? ` <span title="Revision ${r.rev}">(${r.date})</span>` : '');
            }).join(' · ') + ` · data built ${D.built}`;
            if (sim.done || sim.noXp) {
                $('mgStats').innerHTML = '';
                $('mgTables').innerHTML = `<div class="card calc-status">${sim.done ? 'Target is already reached — set a higher target, or choose "A set amount" as the goal.' : 'This setup gives no XP in this skill.'}</div>`;
                $('mgNote').innerHTML = note.join('<br>');
                return;
            }
            const loot = lootTable(sim, x), cost = costTable(sim);
            $('mgTables').className = 'mg-tables' + (cost.html ? '' : ' single');
            $('mgTables').innerHTML = loot.html + cost.html;
            $('mgTables').querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => {
                const k = th.dataset.sort;
                state.sort = state.sort.col === k ? { col: k, dir: state.sort.dir === 'asc' ? 'desc' : 'asc' } : { col: k, dir: k === 'name' ? 'asc' : 'desc' };
                render();
            });

            const profit = loot.total - cost.total;
            const mainXp = x.skill ? sim.xp[x.skill] || 0 : 0;
            const others = Object.entries(sim.xp).filter(([k, q]) => k !== x.skill && q > 0.5).map(([k, q]) => `${GE.fmtGp(Math.round(q))} ${OSRS.skillName(k)}`);
            const rate = sim.units / Math.max(1e-9, sim.hours);
            const cards = [
                statCard(x.skill ? 'XP gained' : 'Loot value', x.skill ? GE.fmtGp(Math.round(mainXp)) : signed(loot.total),
                    x.skill ? `${GE.fmtGp(Math.round(mainXp / Math.max(1e-9, sim.hours)))} XP/h${others.length ? ' · ' + others.join(', ') : ''}` : 'after 2% tax'),
                statCard(x.noGp ? 'XP per hour' : 'Profit', x.noGp ? GE.fmtGp(Math.round(mainXp / Math.max(1e-9, sim.hours))) : signed(profit),
                    x.noGp ? 'no GP from this activity' : cost.unknown ? 'some supplies have no GE price' : 'after 2% tax'),
                statCard(x.units[1][0].toUpperCase() + x.units[1].slice(1), fmtNum(sim.units), `${fmtNum(rate)} an hour`),
                statCard('Time', fmtHours(sim.hours), !x.skill ? 'of play' : goalOf(x) === 'target' ? `to level ${OSRS.levelForXp(tgtXp())}` : `level ${OSRS.levelForXp(sim.endXp)} at the end`)
            ];
            if (!x.noGp) cards.push(statCard('GP / hour', signed(profit / Math.max(1e-9, sim.hours)), x.skill && mainXp ? `${(profit / mainXp).toFixed(2)} GP/XP` : ''));
            for (const [label, value, sub] of (x.stats ? x.stats(sim, c) : [])) cards.push(statCard(label, value, sub));
            $('mgStats').innerHTML = cards.join('');
            $('mgNote').innerHTML = note.concat(['Loot is the expected (average) amount. Sell values take the 2% GE tax off; items that aren\'t on the GE show their quantity only.']).join('<br>');
        }

        function select(key) {
            state.calc = key;
            state.sort = { col: 'total', dir: 'desc' };
            renderPicker();
            updateUrl();
            syncGoal();
            renderInputs();
            render();
        }

        // ---------- Boot ----------
        renderPicker();
        select(state.calc);
        const rsn = params.get('rsn') || (() => { try { return localStorage.getItem(RSN_KEY); } catch (e) { return null; } })();
        if (rsn) { $('mgRsn').value = rsn; loadPlayer(rsn); }
        window.__mg = { CALCS, state, context, simulate, select, valueOf, buyPrice, loadPlayer };   // for the self-check
    })();
    </script>
</body>
</html>
